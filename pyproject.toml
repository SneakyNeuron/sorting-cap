[project]
name = "sortingcap"
version = "0.1.0"
description = "Czech-oriented, local job-hunting harness in the terminal."
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.12,<3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "cryptography>=50.0.2",
    "httpx>=0.28.1",
    "langchain>=1,<2",
    "langchain-deepseek>=1.2.0",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.22,<2",
    "llama-index-core>=0.14.26",
    "llama-index-readers-file>=0.8.0",
    "onnxruntime>=1.32.0",
    "prompt-toolkit>=3,<4",
    "pydantic>=2,<3",
    "rich>=15.0.0",
    "tokenizers>=0.23.3",
]

[project.scripts]
sortingcap = "app.cli:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = ""

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "--import-mode=importlib --disable-socket --allow-unix-socket -m 'not live'"
markers = [
    "live: opt-in evaluation against real models (run with `pytest -m live`); not run by default or in CI",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-socket>=0.8.1",
    "respx>=0.23.1",
    "ruff>=0.17.5",
]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

# These packages ship neither inline types (py.typed) nor stubs on PyPI.
[[tool.mypy.overrides]]
module = [
    "fsspec",
    "fsspec.*",
    "llama_index.readers.file",
    "llama_index.readers.file.*",
    "onnxruntime",
    "onnxruntime.*",
]
ignore_missing_imports = true
